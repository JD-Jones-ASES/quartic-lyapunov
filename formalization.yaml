version: v0.4
project:
  name: Exact quartic Lyapunov classification
  description: >-
    For a specified planar homogeneous cubic family, positive definite real
    homogeneous quartic Lyapunov certificates exist with strict derivative
    exactly when the absolute parameter is below an explicit algebraic boundary,
    and with weak derivative exactly through that boundary. Its value is about
    2.1281535330886186. At the positive endpoint the entire cone of quartics
    with nonpositive derivative is one explicit nonnegative ray, without any
    positivity assumption. The negative Lie derivative of the endpoint quartic is a cubic square
    with three distinct real zero lines. Exact integer certificates separate
    degrees two and four at parameter two, and degrees four and six at nine
    fourths. The formal statements use actual partial derivatives and allow
    unrestricted real coefficients.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.OC, math.DS]
  msc2020: [34D20, 93D05, 14P10]
status:
  scope: >-
    Complete strict and weak quartic classification, isolated algebraic
    boundary, explicit endpoint coefficients, endpoint derivative cone,
    three real cubic zero lines, degree-preserving quartic contraction,
    and explicit strict quartic and sextic degree separations.
    Ten mathematical contracts and fourteen concrete definitions are compared.
    Verification evidence is described in VERIFICATION.md.
  axioms: [propext, Classical.choice, Quot.sound]
sources:
  - title: Exact quartic Lyapunov classification
    type: original-proof
    relationship: other
    location: Proof.md
    note: Accompanying proof of the quartic classification and its endpoint geometry.
  - title: All-degree polynomial Lyapunov classification
    type: original-proof
    relationship: other
    location: docs/AllDegreeClassification.md
    note: Written extension to every positive damping parameter, outside the Lean contract.
  - title: A Globally Asymptotically Stable Planar Homogeneous Polynomial Vector Field With No Polynomial Lyapunov Function
    type: paper
    relationship: background
    authors: [Jun Liu, Maxwell Fitzsimmons]
    id: https://arxiv.org/abs/2607.16171v1
    note: Supplies the vector-field family, polynomial obstruction methods, and outer-factor criterion underlying the written all-degree extension.
  - title: Stability of Polynomial Differential Equations — Complexity and Converse Lyapunov Questions
    type: paper
    relationship: background
    authors: [Amir Ali Ahmadi, Pablo A. Parrilo]
    id: https://arxiv.org/abs/1308.6833
    note: Background on degree obstructions and nonmonotonicity in other planar cubic families.
  - title: On Algebraic Proofs of Stability for Homogeneous Vector Fields
    type: paper
    relationship: background
    authors: [Amir Ali Ahmadi, Bachir El Khadir]
    id: https://arxiv.org/abs/1803.01877
    note: Rational certificates and algebraic Lyapunov converse background.
automation:
  methods:
    - method: agent
      models: [GPT-6, GPT-6 Astra]
      framework: OpenAI Codex and ChatGPT
      tool_setup: Lean and Mathlib at the committed pins, Python Fraction and SymPy.
      notes: >-
        Assisted mathematical arguments, exact certificates, formal proofs,
        independent checks, and documentation. Numerical exploration aided
        certificate discovery; Lean checks the resulting exact identities.
review:
  status: agent-reviewed
  reviewers: [OpenAI Codex, ChatGPT]
  notes: >-
    Independent agent checks of the endpoint cone, sextic identities,
    derivative semantics, and written analytic extensions, with exact
    arithmetic replays and formal kernel verification.
limitations:
  - The all-degree variable-damping classification, exact quadratic boundary, quantitative degree bound, and rational certificate are written results outside the Lean contract.
  - The exact sextic feasibility boundary is not determined.
  - Global ODE stability from the cited source is not formalized here.
  - Worldwide priority and human specialist review are unestablished.
