version: v0.4
project:
  name: Exact quartic Lyapunov classification
  description: >-
    For a specified planar homogeneous cubic family, positive definite real
    homogeneous quartic Lyapunov certificates exist with strict derivative
    exactly when the absolute parameter is below an explicit algebraic
    boundary, and with weak derivative exactly through that boundary.
    The boundary is about 2.1281535330886186, and its square is the unique
    root above one of a displayed degree-six polynomial. The explicit weak
    endpoint quartic is unique up to positive scaling; its negative derivative
    is a cubic square with three distinct real zero lines. A degree-preserving
    contraction proves the entire parameter classification. An integer quartic
    at parameter two is strict while no positive definite homogeneous quadratic
    is even weak. The statements allow all five real quartic coefficients and
    use actual partial derivatives along the field.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.OC, math.DS]
  msc2020: [34D20, 93D05, 14P10]
status:
  scope: >-
    The complete strict and weak signed-parameter classification, isolated
    algebraic boundary, explicit endpoint coefficients, endpoint-ray uniqueness,
    three real cubic zero lines, contraction and rational degree separation.
    Eight mathematical contracts and ten concrete definitions are compared.
    Mechanical verification status is recorded in VERIFICATION.md.
  axioms: [propext, Classical.choice, Quot.sound]
sources:
